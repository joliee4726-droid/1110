<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현장실습 자소서 워크북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --sunk:#F5F7F5; --ink:#17202B; --muted:#5B6673; --line:#CBD3CE;
  --action:#22406B; --action-ink:#FFFFFF; --pen:#C23B2E; --pen-soft:#FBE9E6; --hl:#F7EB7A; --hl-ink:#3D3500;
  --ok:#2F7A55; --ok-soft:#E3F2EA; --soft:#2E5AAC; --soft-bg:#E6EDF8;
  --ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --text:'Gowun Batang','Nanum Myeongjo','AppleMyungjo',serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1B201D; --sunk:#161A18; --ink:#E7ECE8; --muted:#9AA59F; --line:#2E3531;
    --action:#8FB2E8; --action-ink:#0E1A2B; --pen:#F07A6C; --pen-soft:#3A1F1C; --hl:#6B6320; --hl-ink:#FFF6B8;
    --ok:#6CC49A; --ok-soft:#18302A; --soft:#8FB2E8; --soft-bg:#1C2738;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1B201D; --sunk:#161A18; --ink:#E7ECE8; --muted:#9AA59F; --line:#2E3531;
  --action:#8FB2E8; --action-ink:#0E1A2B; --pen:#F07A6C; --pen-soft:#3A1F1C; --hl:#6B6320; --hl-ink:#FFF6B8;
  --ok:#6CC49A; --ok-soft:#18302A; --soft:#8FB2E8; --soft-bg:#1C2738;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--soft);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--text);font-weight:700;font-size:21px;letter-spacing:-.01em}
.brand-sub{color:var(--muted);font-size:13px}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.who{font-size:13px;color:var(--muted)}

.shell{max-width:1120px;margin:0 auto;padding:20px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px)}
.rail ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.rail li{margin:0}
.rail button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px 10px 16px;margin-left:-2px;border-left:2px solid transparent;cursor:pointer;border-radius:0 8px 8px 0}
.rail button:hover{background:var(--surface)}
.rail button[aria-current="step"]{border-left-color:var(--action);background:var(--surface)}
.rail .n{font-weight:700;color:var(--muted);margin-right:6px}
.rail button[aria-current="step"] .n{color:var(--action)}
.rail .t{font-weight:600}
.rail .time{display:block;font-size:12px;color:var(--muted)}
.rail .done .n::after{content:" ✓";color:var(--ok)}
.rail-note{margin-top:18px;font-size:12.5px;color:var(--muted);line-height:1.6}

main{min-width:0}
section.step{display:none}
section.step.show{display:block}
h1{font-family:var(--text);font-size:28px;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 22px;max-width:62ch}
h2{font-size:17px;margin:0 0 4px}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 12px;max-width:66ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.panel.flat{background:var(--sunk)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label.f{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
label.f small{font-weight:400;color:var(--muted);margin-left:4px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{resize:vertical;min-height:90px;line-height:1.7}
textarea.draft{font-family:var(--text);font-size:15.5px;min-height:170px}
input:focus,textarea:focus,select:focus{border-color:var(--action);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--soft-bg)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:10px;cursor:pointer}
.check input{margin-top:4px;width:17px;height:17px;accent-color:var(--action)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:10px 16px;border:1px solid var(--action);background:var(--action);color:var(--action-ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--action)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--pen);color:var(--pen)}
.btn.small{padding:6px 11px;font-size:13px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:6px}

.qcard{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;background:var(--surface)}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qnum{font-family:var(--text);font-weight:700;font-size:18px}
.qhead .sp{flex:1}
.qgrid{display:grid;grid-template-columns:1fr 130px 150px;gap:10px;margin-bottom:10px}
.count{font-size:12.5px;color:var(--muted);text-align:right;margin-top:4px}
.count b{color:var(--ink)}
.count .over{color:var(--pen);font-weight:700}

.flow{counter-reset:f;list-style:none;padding:0;margin:0}
.flow li{counter-increment:f;position:relative;padding:0 0 14px 40px}
.flow li::before{content:counter(f);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--action);color:var(--action);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.flow li b{display:block}
.flow li span{color:var(--muted);font-size:14px}

.cmds{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:0}
.cmds dt{font-weight:700;white-space:nowrap}
.cmds dd{margin:0;color:var(--muted)}
.ai-pick{display:flex;gap:8px;flex-wrap:wrap}
details.prev summary{cursor:pointer;color:var(--action);font-weight:600;font-size:14px}
details.prev pre{white-space:pre-wrap;font-size:12.5px;line-height:1.6;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:340px;overflow:auto;margin:10px 0 0}
.mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini button{text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer}
.mini button:hover{border-color:var(--action)}
.mini b{display:block;font-size:14px}
.mini span{font-size:12.5px;color:var(--muted)}

.demo-bar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 18px}
.demo-bar b{display:block;font-size:14.5px}
.demo-bar span{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--action);color:var(--action);background:transparent;border-radius:999px;padding:7px 16px;font-weight:600;cursor:pointer}
.chip:hover{background:var(--soft-bg)}
.prog-pill{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);white-space:nowrap}
.prog-pill.ok{color:var(--ok);border-color:var(--ok)}
.steps2{list-style:none;margin:0 0 18px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.steps2 li{display:flex;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid var(--line)}
.steps2 li:first-child{border-top:0}
.steps2 .sn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--action);color:var(--action-ink);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px}
.steps2 .sb{flex:1;min-width:0}
.steps2 .sb b{display:block;font-size:16px}
.steps2 .sb span{display:block;font-size:13.5px;color:var(--muted)}
.btn.big{padding:13px 26px;font-size:16px}
details.help{padding:0}
details.help>summary{cursor:pointer;padding:16px 20px;font-weight:700;list-style-position:inside}
.help-body{padding:0 20px 20px}
.md{font-size:14px;line-height:1.7;overflow-x:auto}
.md table{min-width:620px;margin:10px 0}
.md th{background:var(--sunk)}
.md p{margin:6px 0}
.nextbar{background:var(--action);color:var(--action-ink)}
.nextbar-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.nb-label{font-size:12px;font-weight:700;opacity:.8;border:1px solid currentColor;border-radius:999px;padding:1px 9px}
.nb-msg{font-weight:600;flex:1;min-width:200px}
#nbBtn{background:var(--action-ink);color:var(--action);border-color:var(--action-ink)}
.nextbar.done{background:var(--ok)}
.nextbar.done #nbBtn{color:var(--ok)}
.pn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--action);color:var(--action-ink);font-size:13px;margin-right:8px;vertical-align:1px}
h2.sec{margin:26px 0 10px}
.re-eval{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.panel.submit{border-color:var(--action)}
.btn.copied{background:var(--ok);border-color:var(--ok);color:#fff}
.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--hl)}30%{box-shadow:0 0 0 6px var(--hl)}100%{box-shadow:0 0 0 0 transparent}}
.stiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:center}
.stile span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.stile b{font-family:var(--text);font-size:30px;line-height:1.2}
.stile b small{font-size:14px;margin-left:2px;font-family:var(--ui)}
.stile.hit{border-color:var(--ok);color:var(--ok)}
.sline{margin:10px 0 0;font-size:15px}
.score-sum{margin:12px 0 4px;padding:16px 18px;border-radius:10px;background:var(--sunk);border:1px solid var(--line)}
.score-sum .big{font-family:var(--text);font-size:28px;font-weight:700;line-height:1.2}
.score-sum .delta{font-size:16px;font-weight:700;color:var(--ok);margin-left:8px}
.score-sum .goal{display:block;margin-top:6px;font-weight:600}
.score-sum.hit{border-color:var(--ok);background:var(--ok-soft)}
.score-sum .goal.miss{color:var(--pen)}
.score-sum .cond{display:block;margin-top:6px;font-size:13.5px;color:var(--muted)}
.score-sum .empty{color:var(--muted);font-size:14px}
details.score-edit{margin-top:10px}
details.score-edit summary{cursor:pointer;font-size:13px;color:var(--muted)}
.fileline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.filebtn{cursor:pointer}
.fstat{font-size:13px;color:var(--muted)}
.fstat.err{color:var(--pen)}
.fstat.ok{color:var(--ok)}
.drop{outline:2px dashed var(--action);outline-offset:2px}
.expgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.expgrid .span2{grid-column:1 / -1}
.expgrid textarea{min-height:76px}
.expcount{font-size:13px;font-weight:600;color:var(--muted);margin-left:6px}
.expcount.ok{color:var(--ok)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.mode{display:block;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--sunk)}
.mode input{margin-right:6px;accent-color:var(--action)}
.mode b{font-size:14.5px}
.mode span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.mode:has(input:checked){border-color:var(--action);background:var(--soft-bg)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.preset{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer}
.preset:hover{border-color:var(--action)}
.preset.on{background:var(--action);color:var(--action-ink);border-color:var(--action)}
.preset .warn{font-size:11.5px;opacity:.75;margin-left:4px}
.guide5{padding:14px 18px}
.guide5>summary{cursor:pointer}
table.g5{min-width:560px;font-size:13.5px;margin-top:10px}
table.g5 td:first-child{white-space:nowrap;font-weight:600}
.card5{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px 18px;margin-bottom:14px}
.card5.star{border-color:var(--action);box-shadow:0 0 0 1px var(--action)}
.c5head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.c5head .qnum{flex:none}
.c5head select{width:auto;padding:6px 10px;font-size:13.5px}
.c5head .sp{flex:1}
.starbtn{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.starbtn.on{background:var(--action);color:var(--action-ink);border-color:var(--action)}
.c5basic{display:grid;grid-template-columns:1.2fr 1.4fr 1fr;gap:8px}
.c5line{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;align-items:center;margin-top:8px}
.c5line label{font-size:13px;font-weight:600;color:var(--muted)}
.c5line input{padding:8px 10px}
.c5prev{margin-top:12px;font-family:var(--text);font-size:14.5px;line-height:1.8;background:var(--sunk);border-radius:8px;padding:10px 14px;white-space:pre-wrap;word-break:keep-all}
.c5ex summary{cursor:pointer;font-size:13px;color:var(--action);font-weight:600;margin-top:10px}
.c5ex pre{white-space:pre-wrap;font-size:13px;background:var(--sunk);border-radius:8px;padding:10px;margin:8px 0 0;font-family:var(--ui)}
.linkrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.linkrow:first-child{border-top:0}
.linkrow .lt{flex:1;min-width:180px;font-size:14px}
.linkrow .chip{padding:5px 12px;font-size:13px}
.linkrow .chip.on{background:var(--action);color:var(--action-ink)}
.verbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.vgroup b{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.vgroup .vbtns{display:flex;flex-wrap:wrap;gap:6px}
.verb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.verb.on{background:var(--action);color:var(--action-ink);border-color:var(--action)}
.c5acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 8px;font-size:13px;color:var(--muted)}
.c5acts .verb{padding:4px 10px;font-size:12.5px}
.c5tip{margin:0 0 10px;font-size:13px;color:var(--ok);font-weight:600}
.c5basic label.c5q,.c5basic .c5q{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.c5line{grid-template-columns:230px minmax(0,1fr)!important}
.c5line label{display:flex;flex-direction:column;line-height:1.35}
.c5line label .c5q{font-size:13.5px;font-weight:700;color:var(--ink)}
.c5line label small{font-size:11.5px;color:var(--muted);font-weight:500}
.c5exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.c5exgrid b{font-size:12.5px;color:var(--muted)}
.c5exgrid pre{margin-top:4px!important}
.c5prev .muted{color:var(--muted);font-family:var(--ui);font-size:13px}
.c5prev b{font-family:var(--ui);font-size:12.5px;color:var(--muted)}
.score-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.changed{font-family:var(--text);font-size:15.5px;line-height:1.95;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:8px;word-break:keep-all}
.changed strong{font-weight:700;background:linear-gradient(transparent 62%,var(--soft-bg) 62%)}
.blanks{margin-top:14px;border:1.5px dashed var(--hl-ink);border-radius:10px;padding:14px;background:var(--surface)}
.blanks h3{font-size:15px;margin:0 0 4px}
.blank-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.blank-row:first-of-type{border-top:0}
.blank-lab{font-size:14px}
.blank-lab mark{background:var(--hl);color:var(--hl-ink);padding:1px 4px;border-radius:2px}
/* 교정지 */
.proof{font-family:var(--text);font-size:16px;line-height:1.95;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;white-space:normal;word-break:keep-all}
.proof:empty::before{content:"아직 내용이 없습니다. 위 칸에 붙여 넣거나 직접 쓰세요.";color:var(--muted);font-family:var(--ui);font-size:14px}
mark.m-confirm{background:var(--hl);color:var(--hl-ink);padding:1px 2px;border-radius:2px}
mark.m-risk{background:none;color:inherit;text-decoration:underline wavy var(--pen);text-underline-offset:4px;text-decoration-thickness:1.5px}
mark.m-style{background:none;color:inherit;border-bottom:2px dotted var(--soft)}
mark.m-long{background:var(--pen-soft);color:inherit}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:12px;border-radius:2px}
.sw.c{background:var(--hl)} .sw.r{border-bottom:2px solid var(--pen)} .sw.s{border-bottom:2px dotted var(--soft)} .sw.l{background:var(--pen-soft)}

.issues{list-style:none;margin:12px 0 0;padding:0}
.issues li{padding:8px 0 8px 22px;border-top:1px solid var(--line);position:relative;font-size:14px}
.issues li::before{position:absolute;left:0;top:8px;font-weight:700}
.issues li.hard::before{content:"!";color:var(--pen)}
.issues li.warn::before{content:"~";color:var(--pen)}
.issues li.soft::before{content:"·";color:var(--soft)}
.issues li.good::before{content:"✓";color:var(--ok)}

.status{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.st-0{color:var(--pen)} .st-1{color:#9A6B00} .st-2{color:var(--ok)} .st-3{color:var(--soft)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st-1{color:#E7C15A}}
:root[data-theme="dark"] .st-1{color:#E7C15A}

.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:860px){
  .shell{grid-template-columns:1fr;gap:10px;padding:14px}
  nav.rail{position:static}
  .rail ol{display:flex;border-left:0;border-bottom:2px solid var(--line);overflow-x:auto}
  .rail button{border-left:0;border-bottom:2px solid transparent;margin:0 0 -2px;border-radius:8px 8px 0 0;padding:8px 12px;white-space:nowrap}
  .rail button[aria-current="step"]{border-bottom-color:var(--action)}
  .rail .time,.rail-note{display:none}
  .row,.qgrid,.mini,.score-row,.blank-row,.expgrid,.modes,.c5basic{grid-template-columns:1fr}
  .verbs{grid-template-columns:1fr 1fr}
  .c5line{grid-template-columns:1fr!important;gap:4px}
  .c5exgrid{grid-template-columns:1fr}
  h1{font-size:23px}
}

details.diff{padding:14px 18px}
details.diff>summary{cursor:pointer;font-weight:700;font-size:15px}
details.diff table{min-width:520px;font-size:13.5px;margin-top:10px}
details.diff td:first-child{white-space:nowrap;font-weight:600}
.must4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.must4 div{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px}
.must4 b{display:block;font-size:14px;color:var(--action)}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ba div{border-radius:8px;padding:10px 12px;font-family:var(--text);font-size:14.5px;line-height:1.8;word-break:keep-all}
.ba .b{background:var(--pen-soft)} .ba .a{background:var(--ok-soft)}
.ba small{display:block;font-family:var(--ui);font-weight:700;font-size:12px;color:var(--muted)}
.selfsub{margin:14px 0 2px;font-size:13.5px;font-weight:700;color:var(--action)}
@media (max-width:860px){.must4,.ba{grid-template-columns:1fr}.shell>*{min-width:0}}
.entry{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.entry a,.entry div.here{display:block;border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--ink);background:var(--surface)}
.entry a:hover{border-color:var(--action)}
.entry .here{border-color:var(--action)!important;background:var(--soft-bg)!important}
.entry b{display:block;font-size:16px;margin-bottom:2px}
.entry span{display:block;font-size:13.5px;color:var(--muted)}
.entry em{display:inline-block;font-style:normal;font-size:12px;font-weight:700;margin-top:8px;color:var(--action)}
@media (max-width:860px){.entry{grid-template-columns:1fr}}

details.import{padding:14px 18px}
details.import>summary{cursor:pointer;list-style-position:inside}
details.import>summary b{font-size:14.5px}
details.import>summary span{display:block;font-size:13px;color:var(--muted);margin:2px 0 0 18px}
.panel.imported{border-color:var(--ok);background:var(--ok-soft)}
.panel.imported h2{color:var(--ok)}
.imp-list{list-style:none;margin:10px 0 0;padding:0;font-size:14px}
.imp-list li{padding:6px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.imp-list li:first-child{border-top:0}
.imp-list .k{flex:none;width:110px;color:var(--muted);font-weight:600}
.imp-list a{color:var(--action);font-weight:600;cursor:pointer;margin-left:auto;white-space:nowrap}
.imp-pick{margin-top:12px;padding:12px;border:1px dashed var(--action);border-radius:10px}
.imp-pick b{display:block;font-size:14px;margin-bottom:8px}
.imp-pick .chips{gap:6px}
</style>
</head>
<body>
<div id="host"></div>
<template id="tplF">
<header class="top">
  <div class="top-in">
    <span class="brand">현장실습 자소서 처음 쓰기</span>
    <span class="brand-sub">내 경험에서 현장실습 지원 자소서까지, 순서대로 따라 하기</span>
    <div class="top-right">
      <span class="who" id="whoLabel"></span><span class="prog-pill" id="progPill" hidden></span>
      <button class="btn quiet small no-print" id="resetBtn" type="button">새 학생으로 시작</button>
    </div>
  </div>


<div class="nextbar" id="nextBar" role="status" aria-live="polite"><div class="nextbar-in"><span class="nb-label">지금 할 일</span><span class="nb-msg" id="nbMsg"></span><button class="btn small" type="button" id="nbBtn"></button></div></div>
</header>

<div class="shell">
  <nav class="rail" aria-label="진행 단계">
    <ol id="rail">
      <li><button type="button" data-go="1"><span class="n">1</span><span class="t">소재 정리</span></button></li>
      <li><button type="button" data-go="2"><span class="n">2</span><span class="t">지원 정보</span></button></li>
      <li><button type="button" data-go="3"><span class="n">3</span><span class="t">AI 코치와 초안</span></button></li>
      <li><button type="button" data-go="4"><span class="n">4</span><span class="t">결과 정리</span></button></li>
    </ol>
    <p class="rail-note">입력한 내용은 이 브라우저에만 저장됩니다. 공용 PC라면 마친 뒤 ‘새 학생으로 시작’을 눌러 지워 주세요.</p>
  </nav>

  <main>
  <!-- STEP 1 -->
  <section class="step" id="s1">
    <h1>소재 정리: 좋아하는 행동에서 경험 찾기</h1>
    <p class="lead">현장실습 지원서는 정규 채용과 보는 기준이 다릅니다. 아래 차이를 먼저 읽고, 내가 좋아하는 행동과 그 행동을 했던 경험을 이력서 경력 기술 5줄로 정리하세요. 이 카드가 이력서의 경력 기술이 되고 자소서의 재료가 됩니다.</p>
    <p class="hint" style="margin:0 0 8px;font-weight:700;color:var(--ink)">먼저 나에게 맞는 입구를 고르세요</p>
    <nav class="entry" aria-label="워크북 선택"><div class="here"><b>아직 하나도 안 썼어요</b><span>경험 정리부터 AI 코치 질문까지 따라가며 처음부터 씁니다</span><em>지금 이 화면입니다 ↓</em></div><a href="#" data-app="revise"><b>써 온 자소서가 있어요</b><span>정규 채용용으로 쓴 것도 됩니다. 현장실습 기준으로 진단하고 다듬습니다</span><em>첨삭으로 가기 →</em></a></nav>
    <details class="panel diff" open>
      <summary>현장실습 자소서는 정규 채용 자소서와 이렇게 다릅니다 (1분 읽기)</summary>
      <p class="hint" style="margin:8px 0 0">정규 채용은 “당장 성과를 낼 사람인가”를 봅니다. 현장실습은 <b>“이 기간에 무엇을 배워 갈지 알고, 현장에 안전하게 적응할 사람인가”</b>를 봅니다.</p>
      <div class="table-wrap"><table>
        <tr><th>항목</th><th>정규 채용 자소서</th><th>현장실습 자소서</th></tr>
        <tr><td>지원동기</td><td>회사 비전 공감</td><td>전공 수업에서 배운 것과 현장 사이의 <b>‘빈칸’</b>을 메우려는 이유</td></tr>
        <tr><td>역량</td><td>직무에 바로 투입할 역량</td><td>기초역량(정확성·기록·규칙 지키기·협업)과 <b>실습생으로 실제 보조할 수 있는 일</b></td></tr>
        <tr><td>경험</td><td>성과·수치 중심</td><td><b>과정, 피드백을 받아 고친 방식, 배운 점</b> 중심</td></tr>
        <tr><td>포부</td><td>“입사 후 기여”</td><td><b>실습 기간 안의 학습계획</b>과 실습 후 학업·진로 연결</td></tr>
        <tr><td>톤</td><td>자신감 있는 주장</td><td>겸손하되 구체적인 학습 의지 (막연한 “배우겠습니다” 금지)</td></tr>
      </table></div>
      <p class="hint" style="margin:14px 0 0"><b>자소서 전체에 아래 4가지가 각각 한 번 이상 들어가야 합니다.</b></p>
      <div class="must4">
        <div><b>① 왜 이 실습인가</b>수업에서 궁금했지만 현장을 봐야 알 수 있는 것</div>
        <div><b>② 학습목표 1개</b>실습 기간 안에 익힐 업무 한 가지</div>
        <div><b>③ 실습생의 기여</b>기록·정리·확인·보조처럼 실제로 할 수 있는 일</div>
        <div><b>④ 실습 후 연결</b>복학 후 수업·졸업 과제·진로 결정에 쓸 방법</div>
      </div>
      <div class="ba">
        <div class="b"><small>이렇게 쓰면 탈락 위험</small>입사 후 맡은 업무를 완벽하게 수행하여 회사 발전에 기여하겠습니다. 많은 것을 배우겠습니다.</div>
        <div class="a"><small>현장실습용으로 고치면</small>실습 기간 동안 입고 서류와 실물을 대조하는 일을 정확히 익히고, 확인한 내용을 정해진 양식에 빠짐없이 기록하겠습니다. 이 경험을 졸업 과제 주제를 정하는 근거로 쓰겠습니다.</div>
      </div>
    </details>

    <div class="panel flat demo-bar">
      <div><b>처음이라면 예시부터 보세요</b><span>가상의 학생 자료로 모든 단계를 미리 볼 수 있습니다. 내 자료를 넣기 전에 ‘새 학생으로 시작’을 누르면 지워집니다.</span></div>
      <button class="btn ghost small" type="button" id="demoBtn">예시로 채워 보기</button>
    </div>

    <div class="panel" id="likePanel">
      <h2><span class="pn">1</span>내가 좋아하는 행동 고르기 <small style="font-weight:400;color:var(--muted)">2~3개</small></h2>
      <p class="hint">잘하는 것보다 <b>할 때 시간 가는 줄 모르는 행동</b>을 고르세요. 고른 행동을 실제로 했던 경험을 아래 카드로 정리합니다.</p>
      <div class="verbs" id="verbs"></div>
      <div class="fileline"><input type="text" id="verbCustom" placeholder="목록에 없으면 직접 쓰기 (예: 가르친다)" style="max-width:280px"><button class="btn ghost small" type="button" id="verbAdd">추가</button><span class="fstat" id="verbStat"></span></div>
    </div>

    <h2 class="sec"><span class="pn">2</span>그 행동을 했던 경험을 5줄로 정리하기</h2>
    <details class="panel guide5">
      <summary><b>5줄 구조 한눈에 보기</b></summary>
      <div class="table-wrap"><table class="g5">
        <tr><th>줄</th><th>쓰는 내용</th><th>형식</th></tr>
        <tr><td>기본 정보</td><td>어디서, 무엇을, 언제</td><td>[운영 기관] [프로그램명] 참여 (20XX.XX~XX.XX)</td></tr>
        <tr><td>① 수행 범위</td><td>전체적으로 무엇을 했나</td><td>[분야·과정] 전반 실습 및 [주요 업무] 경험</td></tr>
        <tr><td>② 도구·핵심 행동</td><td>무엇을 써서 무엇을 했나</td><td>[도구·장비·프로그램]을 활용한 [대상] [행동] 수행</td></tr>
        <tr><td>③ 기준·주의점</td><td>무엇을 지키며 했나</td><td>[기준·주의점]을 고려해 [작업] 수행</td></tr>
        <tr><td>④ 문제·비교</td><td>예상과 달랐던 일, 무엇을 비교했나</td><td>[예상과 다른 결과] 발생 시 [조건·데이터] 비교</td></tr>
        <tr><td>⑤ 조치·결과</td><td>어떻게 했고 무엇이 달라졌나</td><td>[조치]를 통해 [결과·변화] 확인</td></tr>
      </table></div>
      <p class="hint" style="margin:10px 0 0">자소서로 옮길 때는 ①②③이 상황과 과정, ④가 전환점, ⑤가 결과가 됩니다. 배운 점은 이력서에는 넣지 않고 ⑥에 따로 적어 자소서에만 씁니다. 모르는 줄은 비워 두세요. AI 코치가 질문으로 함께 채웁니다.<br><b>현장실습 자소서에서는</b> 숫자 성과보다 ④⑤에서 <b>누구에게 어떤 피드백을 받고 무엇을 고쳤는지</b>와 ⑥ 배운 점이 더 중요합니다.</p>
    </details>

    <div id="cards"></div>
    <div class="btns" style="margin-top:0"><button class="btn ghost" type="button" id="addCard">경험 카드 추가</button></div>

    <div class="panel" style="margin-top:18px">
      <h2><span class="pn">3</span>나에 대해 짧게 <small style="font-weight:400;color:var(--muted)">선택, 나의 한 줄을 만드는 데 씁니다</small></h2>
      <div class="row" style="margin-top:12px">
        <div><label class="f" for="me_major">전공</label><input type="text" id="me_major" placeholder="예: 산업공학"></div>
        <div><label class="f" for="me_value">일할 때 가장 중요하게 여기는 것</label><input type="text" id="me_value" placeholder="예: 약속한 시간 지키기"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <div><label class="f" for="me_proud">가장 뿌듯했던 순간 한 줄</label><input type="text" id="me_proud" placeholder="예: 대기 시간이 줄어 손님이 고맙다고 한 날"></div>
        <div><label class="f" for="me_combo">다른 지원자와 다른 나만의 조합</label><input type="text" id="me_combo" placeholder="예: 공대 전공 + 고객 응대 경험"></div>
      </div>
    </div>

    <div class="next" style="margin-top:26px"><span></span><button class="btn" type="button" data-go="2">지원 정보로 가기</button></div>
  </section>

  <!-- STEP 2 -->
  
<section class="step" id="s2">
    <h1>어느 현장실습에 지원하나요?</h1>
    <p class="lead">실습 기관과 모집공고를 넣고, 현장실습 자소서에 꼭 들어가야 할 4가지를 미리 적어 봅니다. 모르는 칸은 비워 두면 AI 코치가 선택지로 함께 찾습니다.</p>
    <div class="panel">
      <h2><span class="pn">1</span>지원 방향</h2>
      <div class="modes" role="radiogroup" aria-label="지원 방향">
        <label class="mode"><input type="radio" name="mode" value="full"><b>실습 기관이 정해졌어요</b><span>모집공고에 맞춰 씁니다</span></label>
        <label class="mode"><input type="radio" name="mode" value="role"><b>실습 분야만 정했어요</b><span>그 분야 실습생이 하는 일 기준으로 씁니다</span></label>
        <label class="mode"><input type="radio" name="mode" value="none"><b>아직 정하지 않았어요</b><span>어디에나 쓸 수 있는 기본 현장실습 자소서를 씁니다</span></label>
      </div>
      <div id="modeFields" style="margin-top:14px">
        <div class="row">
          <div id="fCompany"><label class="f" for="company">실습 기관명</label><input type="text" id="company" placeholder="예: ○○구청, ○○제조"></div>
          <div id="fRole"><label class="f" for="role">실습 분야·직무</label><input type="text" id="role" list="roleList" placeholder="예: 품질관리 현장실습 (목록에서 고르거나 직접 입력)"></div>
        </div>
        <p class="hint" id="modeHint" style="margin:10px 0 0"></p>
      </div>
      <datalist id="roleList"><option value="영업"><option value="B2B영업"><option value="마케팅"><option value="인사(HR)"><option value="재무·회계"><option value="사무·행정"><option value="고객서비스(CS)"><option value="구매·SCM"><option value="생산관리"><option value="품질관리"><option value="연구개발(R&amp;D)"><option value="소프트웨어 개발"><option value="데이터 분석"><option value="디자인"><option value="교육·강의"><option value="공공기관 사무"></datalist>
      <div style="margin-top:12px"><label class="f" for="student">이름 <small>선택</small></label><input type="text" id="student" placeholder="예: 홍길동"></div>
    </div>

    <div class="panel" id="jdPanel">
      <h2><span class="pn">2</span>현장실습 모집공고 (실습 내용) <small id="jdOpt" style="font-weight:400;color:var(--muted)"></small></h2>
      <p class="hint">실습 내용(실습생이 맡는 일), 지원 자격, 우대사항 부분을 붙여 넣으세요. 학교 현장실습 지원시스템의 공고도 됩니다. 이미지뿐이라면 아래를 체크하고 ChatGPT에 파일을 직접 첨부하면 됩니다.</p>
      <textarea id="jd" rows="7" placeholder="실습 내용&#10;· …&#10;&#10;지원 자격&#10;· …&#10;&#10;우대사항&#10;· …"></textarea>
      <div class="fileline"><label class="btn quiet small filebtn">PDF·TXT 파일에서 불러오기<input type="file" id="jdFile" accept=".pdf,.txt,image/*" hidden></label><span class="fstat" id="jdStat"></span></div>
      <label class="check"><input type="checkbox" id="jdAttach"> 공고를 이미지나 PDF로 ChatGPT에 직접 첨부하겠습니다</label>
      <label class="check"><input type="checkbox" id="blind"> 블라인드 채용입니다 (공기업·공공기관 등, 학교명·출신지·가족 정보 금지)</label>

function renderLinks(){
  var box=$('links');if(!box)return;

  var qs=state.items.map(function(it,i){return{it:it,i:i};}).filter(function(x){return x.it.q.trim();});

}

/* ---------- parsing ---------- */
function parseAi(txt){
  var t=norm(txt),m=t.match(/===\s*자소서 최종본\s*===([\s\S]*?)(===\s*끝\s*===|$)/);
  var body=m?m[1]:t;
  var re=/^[ \t>*#]*\[\s*문항\s*(\d+)\s*\][^\n]*$/gm,hits=[],x;
  while((x=re.exec(body)))hits.push({n:+x[1],s:x.index,e:x.index+x[0].length,line:x[0]});
  var out={};
  hits.forEach(function(h,i){
    var end=i+1<hits.length?hits[i+1].s:body.length;
    var rest=h.line.replace(/^[ \t>*#]*\[\s*문항\s*\d+\s*\]\s*/,'').replace(/^\*\*\s*/,'').trim();
    var seg=body.slice(h.e,end).replace(/^\n+/,'');
    seg=seg.replace(/\n?-{3,}\s*$/,'').replace(/\s+$/,'');
    if(rest&&!/^\(?\s*글자|^\(?\s*공백/.test(rest))seg=rest+'\n'+seg;
    out[h.n]=seg;
  });
  return out;
}

  RULES.forEach(function(r){

    if(c){
      if(r.id==='ai'&&c<3){res.issues.push({lv:'soft',msg:r.msg+' ('+c+'회)'});}
      else{res.issues.push({lv:r.lv==='soft'?'warn':r.lv,msg:r.msg+' ('+c+'회)'});if(r.lv==='hard')res.hard++;else res.warn++;}
    }
  });

    else if(res.n<it.limit*0.9){res.issues.unshift({lv:'hard',msg:'분량 부족: '+res.n+'/'+it.limit+'자('+Math.round(res.n/it.limit*100)+'%). 제한의 95% 이상('+Math.ceil(it.limit*0.95)+'자)까지 확인된 사실로 채우세요. AI 대화창에 ‘글자수에 맞추기’ 요청을 보내면 됩니다.'});res.hard++;}

  }
  var ss=sentences(t),endings={},pos=0;

  var longN=ss.filter(function(s){return s.length>110;}).length;
  if(longN){res.issues.push({lv:'warn',msg:'110자가 넘는 긴 문장이 '+longN+'개 있습니다. 두 문장으로 나누면 읽기 쉬워집니다.'});res.warn++;}

function loadPdfLib(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);

function readFileText(file){
  var name=(file.name||'').toLowerCase();
  if(/^image\//.test(file.type))return Promise.reject(new Error('image'));
  if(/\.txt$/.test(name)||file.type==='text/plain')return file.text();
  if(!/\.pdf$/.test(name)&&file.type!=='application/pdf')return Promise.reject(new Error('type'));
  return loadPdfLib().then(function(lib){return file.arrayBuffer().then(function(ab){return lib.getDocument({data:ab,cMapUrl:PDFJS+'cmaps/',cMapPacked:true}).promise;});}).then(function(pdf){
    var n=Math.min(pdf.numPages,10),jobs=[];
    for(var k=1;k<=n;k++)jobs.push(pdf.getPage(k).then(function(pg){return pg.getTextContent();}).then(function(ct){return ct.items.map(function(it){return it.str+(it.hasEOL?'\n':'');}).join('');}));
    return Promise.all(jobs).then(function(pages){return pages.join('\n').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();});
  });
}

  if(m==='type')return'PDF나 TXT 파일만 불러올 수 있습니다.';
  if(m==='net')return'PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인하거나 글자를 복사해 붙여 넣으세요.';

function copyText(t,okMsg,btn){
  if(btn){var old=btn.dataset.label||btn.textContent;btn.dataset.label=old;btn.textContent='복사됨 ✓';btn.classList.add('copied');clearTimeout(btn._c);btn._c=setTimeout(function(){btn.textContent=old;btn.classList.remove('copied');},1800);}
  function fallback(){var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);toast(ok?okMsg:'복사가 막혀 있습니다. 미리 보기를 열어 직접 선택해 복사하세요.');}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(okMsg);},fallback);}else fallback();
}

/* ---------- steps ---------- */
function go(n){
  n=+n;state.step=n;save();
  document.querySelectorAll('section.step').forEach(function(s){s.classList.toggle('show',s.id==='s'+n);});
  document.querySelectorAll('#rail button').forEach(function(b){if(+b.dataset.go===n)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
  if(n===2)renderReady();
  if(n===3)renderProof();
  markDone();
  window.scrollTo({top:0,behavior:'smooth'});
}
function nextAction(){
  var s=state;
  var anyQ=s.items.some(function(i){return i.q.trim();});
  var anyD=s.items.some(function(i){return i.draft.trim();});
  if(!(s.company||s.role)&&!anyQ&&!anyD)return{m:'써 둔 초안이나 처음 쓰기 워크북 내용을 ‘초안 붙여 넣기’ 칸에 넣으세요',b:'붙여 넣기 열기',f:function(){go(1);var b=$('importBox');b.open=true;setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'center'});b.classList.add('flash');$('importTxt').focus({preventScroll:true});},200);}};
  if(!(s.company||s.role)&&s.direction!=='none')return{m:'실습 기관명과 실습 분야를 넣으세요',b:'1단계로',f:function(){go(1);focusEl('company');}};
  var noQ=s.items.findIndex(function(i){return!i.q.trim();});
  if(noQ>=0)return{m:'문항 '+(noQ+1)+'의 질문을 넣으세요',b:'넣으러 가기',f:function(){go(1);focusEl('q'+noQ);}};
  if(!s.copied)return{m:'지시문을 복사해 ChatGPT 새 대화에 붙여 넣으세요',b:'복사하기',f:function(){go(2);$('copyMaster').click();}};
  var hasFinal=s.items.some(function(i){return i.final.trim();});
  if(!hasFinal)return{m:'ChatGPT와 대화를 마치고 ‘/완성’ 결과를 붙여 넣으세요',b:'붙여 넣으러 가기',f:function(){go(3);focusEl('aiOut');}};
  var bi=s.items.findIndex(function(i){return/【[^】]*】/.test(i.final);});
  if(bi>=0){var n=(s.items[bi].final.match(/【[^】]*】/g)||[]).length;return{m:'문항 '+(bi+1)+'에 채울 빈칸이 '+n+'곳 있습니다',b:'빈칸 채우기',f:function(){go(3);setTimeout(function(){var el=$('bl'+bi);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');var x=el.querySelector('input');if(x)x.focus({preventScroll:true});}},200);}};}
  var li=s.items.findIndex(function(it){var n=cnt(it,it.final);return it.limit&&(n>it.limit||n<it.limit*0.9);});
  if(li>=0){var it=s.items[li];return{m:'문항 '+(li+1)+' 글자수를 맞추세요 ('+cnt(it,it.final)+'/'+it.limit+'자)',b:'맞추기 요청 복사',f:function(){copyText(MINI.fit.replace('[문항 번호]','[문항 '+(li+1)+']'),'복사했습니다. ChatGPT에 보내고 새 결과를 붙여 넣으세요.',$('nbBtn'));}};}
  var SELF=['fact','role','voice','consist','gap','goal','scope','after'];var selfN=SELF.filter(function(k){return s.self&&s.self[k];}).length;
  if(selfN<SELF.length)return{m:'제출 전 스스로 확인 '+SELF.length+'가지를 체크하세요 ('+selfN+'/'+SELF.length+')',b:'확인하러 가기',f:function(){go(3);setTimeout(function(){var el=document.querySelector('.self');if(el)el.closest('.panel').scrollIntoView({behavior:'smooth',block:'center'});},200);}};
  return{m:s.finalCopied?'완성했습니다. 복사한 자소서를 제출 사이트에 붙여 넣으세요':'준비 완료! 최종 자소서를 복사하세요',b:'최종 자소서 복사',done:true,f:function(){go(3);$('copyFinal').click();}};

function focusEl(id){setTimeout(function(){var el=$(id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.focus({preventScroll:true});el.classList.add('flash');}},200);}
var curAct=null;
function renderNext(){curAct=nextAction();$('nbMsg').textContent=curAct.m;var b=$('nbBtn');if(!b.classList.contains('copied'))b.textContent=curAct.b;$('nextBar').classList.toggle('done',!!curAct.done);}
function markDone(){
  var d1=(state.company||state.role)&&state.items.some(function(i){return i.q.trim();});
  var d2=!!state.aiOut.trim();
  var d3=state.items.length&&state.items.every(function(i){return i.final.trim();});
  var flags={1:d1,2:d2,3:d3,4:false};
  document.querySelectorAll('#rail button').forEach(function(b){b.classList.toggle('done',!!flags[b.dataset.go]);});
  var w=[state.student,state.company].filter(Boolean).join(' / ');
  $('whoLabel').textContent=w;
  var pill=$('progPill');
  if(state.items.some(function(i){return i.final.trim();})){
    var ok=state.items.filter(function(it){return analyze(it).status>=1;}).length;
    pill.hidden=false;pill.textContent='제출 가능 '+ok+'/'+state.items.length;pill.classList.toggle('ok',ok===state.items.length);
  }else pill.hidden=true;
  renderNext();
}

function renderQ(){
  var box=$('qList');box.innerHTML='';
  state.items.forEach(function(it,i){
    var c=document.createElement('div');c.className='qcard';
    c.innerHTML='<div class="qhead"><span class="qnum">문항 '+(i+1)+'</span><span class="sp"></span>'+(state.items.length>1?'<button class="btn danger small" type="button" data-del="'+i+'">삭제</button>':'')+'</div>'+
      '<div class="qgrid"><div><label class="f" for="q'+i+'">문항 질문</label><input type="text" id="q'+i+'" value="'+esc(it.q)+'" placeholder="예: 소속 조직의 공동 과업을 달성하며 겪은 어려움과 노력"></div>'+
      '<div><label class="f" for="l'+i+'">글자수 제한</label><input type="number" min="0" step="50" id="l'+i+'" value="'+(it.limit||'')+'"></div>'+
      '<div><label class="f" for="m'+i+'">세는 기준</label><select id="m'+i+'"><option value="with">공백 포함</option><option value="without">공백 제외</option></select></div></div>'+
      '<label class="f" for="d'+i+'">지금 쓴 답변 <small>없으면 비워 두세요</small></label><textarea class="draft" id="d'+i+'" placeholder="소제목과 본문을 그대로 붙여 넣으세요.">'+esc(it.draft)+'</textarea><div class="fileline" style="justify-content:space-between"><span><label class="btn quiet small filebtn">PDF·TXT 불러오기<input type="file" class="dFile" data-i="'+i+'" accept=".pdf,.txt" hidden></label><span class="fstat" id="dst'+i+'"></span></span><span class="count" id="dc'+i+'"></span></div>';
    box.appendChild(c);
    var sel=c.querySelector('#m'+i);sel.value=it.mode;
    c.querySelector('#q'+i).addEventListener('input',function(){it.q=this.value;save();markDone();});
    c.querySelector('#l'+i).addEventListener('input',function(){it.limit=parseInt(this.value,10)||0;upd();save();});
    sel.addEventListener('change',function(){it.mode=this.value;upd();save();});
    c.querySelector('#d'+i).addEventListener('input',function(){it.draft=this.value;upd();save();});
    function upd(){var n=cnt(it,it.draft);var over=it.limit&&n>it.limit;c.querySelector('#dc'+i).innerHTML=modeLabel(it.mode)+' <b class="'+(over?'over':'')+'">'+n+'</b>'+(it.limit?' / '+it.limit+'자':'자');}
    upd();
  });
}

/* ---------- parsing ---------- */
function parseAi(txt){
  var t=norm(txt),m=t.match(/===\s*자소서 최종본\s*===([\s\S]*?)(===\s*끝\s*===|$)/);
  var body=m?m[1]:t;
  var re=/^[ \t>*#]*\[\s*문항\s*(\d+)\s*\][^\n]*$/gm,hits=[],x;
  while((x=re.exec(body)))hits.push({n:+x[1],s:x.index,e:x.index+x[0].length,line:x[0]});
  var out={};
  hits.forEach(function(h,i){
    var end=i+1<hits.length?hits[i+1].s:body.length;
    var rest=h.line.replace(/^[ \t>*#]*\[\s*문항\s*\d+\s*\]\s*/,'').replace(/^\*\*\s*/,'').trim();
    var seg=body.slice(h.e,end).replace(/^\n+/,'');
    seg=seg.replace(/\n?-{3,}\s*$/,'').replace(/\s+$/,'');
    if(rest&&!/^\(?\s*글자|^\(?\s*공백/.test(rest))seg=rest+'\n'+seg;
    out[h.n]=seg;
  });
  return out;
}

  {id:'abstract',re:/노력했습니다|노력하였습니다|노력했고|최선을 다했|최선을 다하|열심히|성실히|기여했습니다|기여하였습니다|소통했습니다|협업했습니다/g,cls:'m-risk',lv:'warn',msg:'무엇을, 어떻게 했는지 행동으로 바꾸면 증거력이 올라갑니다.'},
  {id:'exagg',re:/획기적|완벽하게|완벽히|100%|누구보다|최고의|반드시|항상/g,cls:'m-risk',lv:'warn',msg:'근거가 없으면 과장으로 읽히는 표현입니다. 사실로 뒷받침하거나 지우세요.'},

  {id:'vague',re:/많이 배우|많은 것을 배우|많은 것을 경험|배우고 싶습니다|배우겠습니다|열심히 하겠습니다|최선을 다하겠습니다/g,cls:'m-risk',lv:'warn',msg:'막연한 학습 다짐입니다. 어떤 업무에서 무엇을 익힐지 한 가지로 쓰세요.'},
  {id:'ai',re:/(?:을|를) 통해|다양한|함양|시너지|귀사|이를 바탕으로|뿐만 아니라|나아가|성장할 수 있었습니다|깨달을 수 있었습니다|배울 수 있었습니다/g,cls:'m-style',lv:'soft',msg:'AI 글에서 자주 보이는 표현입니다. 한두 번은 괜찮지만 반복되면 평소 말투로 바꾸세요.'}
];
function sentences(t){return(norm(t).match(/[^.!?\n]+[.!?]?/g)||[]).map(function(s){return s.trim();}).filter(Boolean);}
var BLIND_RE=/[가-힣]{2,}(?:대학교|대학원|고등학교|대학)|대학교|고등학교|고향|출신|아버지|어머니|부모님|가족|형제|자매|\d{2}세|\d{2}살/g;
function analyze(it){
  var t=norm(it.final),res={marks:[],issues:[],hard:0,warn:0,n:cnt(it,t)};
  if(!t){res.issues.push({lv:'hard',msg:'아직 수정본이 없습니다.'});res.hard++;res.status=0;return res;}
  RULES.forEach(function(r){
    r.re.lastIndex=0;var m,c=0;
    while((m=r.re.exec(t))){res.marks.push({s:m.index,e:m.index+m[0].length,cls:r.cls,tip:r.msg});c++;if(!m[0].length)r.re.lastIndex++;}
    if(c){
      if(r.id==='ai'&&c<3){res.issues.push({lv:'soft',msg:r.msg+' ('+c+'회)'});}
      else{res.issues.push({lv:r.lv==='soft'?'warn':r.lv,msg:r.msg+' ('+c+'회)'});if(r.lv==='hard')res.hard++;else res.warn++;}
    }
  });
  if(state.blind&&t){BLIND_RE.lastIndex=0;var bm,bc=0;while((bm=BLIND_RE.exec(t))){res.marks.push({s:bm.index,e:bm.index+bm[0].length,cls:'m-risk',tip:'블라인드 위반 위험'});bc++;}
    if(bc){res.issues.unshift({lv:'hard',msg:'블라인드 위반 위험 '+bc+'곳: 학교명·출신지·가족·나이 정보는 지우거나 바꾸세요.'});res.hard++;}}
  if(it.limit){
    if(res.n>it.limit){res.issues.unshift({lv:'hard',msg:modeLabel(it.mode)+' '+res.n+'자로 제한 '+it.limit+'자를 넘었습니다.'});res.hard++;}
    else if(res.n<it.limit*0.9){res.issues.unshift({lv:'hard',msg:'분량 부족: '+res.n+'/'+it.limit+'자('+Math.round(res.n/it.limit*100)+'%). 제한의 95% 이상('+Math.ceil(it.limit*0.95)+'자)까지 확인된 사실로 채우세요. AI 대화창에 ‘글자수에 맞추기’ 요청을 보내면 됩니다.'});res.hard++;}
    else if(res.n<it.limit*0.95){res.issues.push({lv:'warn',msg:'조금 짧습니다: '+res.n+'/'+it.limit+'자. 목표는 '+Math.ceil(it.limit*0.95)+'~'+it.limit+'자입니다.'});res.warn++;}
  }
  var ss=sentences(t),endings={},pos=0;
  ss.forEach(function(s){
    var idx=t.indexOf(s,pos);if(idx>=0)pos=idx+s.length;
    if(s.length>110&&idx>=0){res.marks.push({s:idx,e:idx+s.length,cls:'m-long',tip:'긴 문장'});}
    var last=s.replace(/[.!?]+$/,'').split(/\s+/).pop();
    if(/다$/.test(last))endings[last]=(endings[last]||0)+1;
  });
  var longN=ss.filter(function(s){return s.length>110;}).length;
  if(longN){res.issues.push({lv:'warn',msg:'110자가 넘는 긴 문장이 '+longN+'개 있습니다. 두 문장으로 나누면 읽기 쉬워집니다.'});res.warn++;}
  var rep=Object.keys(endings).filter(function(k){return endings[k]>=3;});
  if(rep.length){res.issues.push({lv:'warn',msg:'같은 끝맺음이 3번 이상 반복됩니다: '+rep.map(function(k){return'“'+k+'” '+endings[k]+'회';}).join(', ')});res.warn++;}
  if(/팀|우리|함께|조원|동료/.test(t)&&!/저는|제가|저의|제 /.test(t)){res.issues.push({lv:'warn',msg:'팀 이야기는 있는데 "저는/제가"가 없습니다. 내가 한 일이 무엇인지 보이게 하세요.'});res.warn++;}
  if(!res.issues.length)res.issues.push({lv:'good',msg:'자동 점검에서 걸린 표현이 없습니다.'});
  res.status=res.hard?0:(res.warn>=3?1:2);
  return res;
}
function annotate(t,marks){
  t=norm(t);marks=marks.slice().sort(function(a,b){return a.s-b.s||b.e-a.e;});
  var out='',p=0;
  marks.forEach(function(m){if(m.s<p)return;out+=esc(t.slice(p,m.s))+'<mark class="'+m.cls+'" title="'+esc(m.tip)+'">'+esc(t.slice(m.s,m.e))+'</mark>';p=m.e;});
  out+=esc(t.slice(p));
  return out.replace(/\n/g,'<br>');
}

/* ---------- 완성 후 평가 ---------- */
function mdInline(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');}
function mdRender(txt){
  var lines=norm(txt).split('\n'),out='',i=0;
  while(i<lines.length){
    var l=lines[i];
    if(/^\s*\|/.test(l)){
      var rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
      rows=rows.filter(function(r){return!/^\s*\|[\s:|-]+\|\s*$/.test(r);});
      out+='<table>'+rows.map(function(r,k){var cells=r.trim().replace(/^\||\|$/g,'').split('|');var tag=k===0?'th':'td';return'<tr>'+cells.map(function(c){return'<'+tag+'>'+mdInline(c.trim())+'</'+tag+'>';}).join('')+'</tr>';}).join('')+'</table>';
      continue;
    }
    if(l.trim())out+='<p>'+mdInline(l.replace(/^#+\s*/,''))+'</p>';
    i++;
  }
  return out;
}
function lastNum(t,re){var m,v=null;re.lastIndex=0;while((m=re.exec(t)))v=m[1];return v;}
function fillScore(txt){
  var t=norm(txt).replace(/\*\*/g,'');
  var ini=lastNum(t,/초기(?:\s*(?:진단|점수|총점))?\s*[:：]?\s*(\d{1,3})\s*(?:점|\/\s*100)?/g);
  var fin=lastNum(t,/(?:현재|최종|완성\s*후)(?:\s*(?:점수|총점))?\s*[:：]?\s*(\d{1,3})\s*(?:점|\/\s*100)/g);
  var tgt=lastNum(t,/목표(?:\s*점수)?\s*[:：]?\s*(\d{1,3})\s*점/g);
  if(!ini&&!fin&&!tgt)return null;
  state.score=state.score||{};
  if(ini)state.score.init=ini;if(fin)state.score.final=fin;if(tgt)state.score.target=tgt;
  $('scInit').value=state.score.init||'';$('scFinal').value=state.score.final||'';$('scTarget').value=state.score.target||'';save();
  return true;
}
function renderScore(){
  var sc=state.score||{},box=$('scoreSum'),i=parseInt(sc.init,10),f=parseInt(sc.final,10),g=parseInt(sc.target,10);
  function tile(lab,v,cls){return'<div class="stile'+(cls?' '+cls:'')+'"><span>'+lab+'</span><b>'+(isNaN(v)?'-':v)+'<small>점</small></b></div>';}
  var d=(!isNaN(i)&&!isNaN(f))?f-i:null,hit=!isNaN(g)&&!isNaN(f)&&f>=g;
  var h='<div class="stiles">'+tile('진단 점수',i)+tile('목표 점수',g)+tile('최종 점수',f,hit?'hit':'')+'</div>';
  var line=[];
  if(d!==null)line.push('<b style="color:'+(d>=0?'var(--ok)':'var(--pen)')+'">'+(d>=0?'+':'')+d+'점</b>');
  if(!isNaN(g)&&!isNaN(f))line.push(hit?'<b style="color:var(--ok)">목표 달성</b>':'<b style="color:var(--pen)">목표까지 '+(g-f)+'점</b>');
  var src=norm(state.evalOut)||((norm(state.aiOut).match(/===\s*끝\s*===([\s\S]*)$/)||[])[1]||'');
  var cl=src.split('\n').filter(function(l){return/조건부/.test(l);})[0];
  if(line.length)h+='<p class="sline">'+line.join(' · ')+'</p>';
  if(cl&&!hit)h+='<span class="cond">'+mdInline(cl.replace(/^[\s|*#-]+/,'').replace(/\|/g,' ').trim())+'</span>';
  var none=isNaN(i)&&isNaN(f)&&isNaN(g);
  if(none&&norm(state.aiOut)){h+='<span class="cond" style="color:var(--pen)">결과에서 점수를 찾지 못했습니다. 아래 ‘점수 직접 적기’에 옮겨 적거나, 2단계 ‘점수가 안 나온다’ 요청을 ChatGPT에 보내고 받은 한 줄을 아래 재평가 칸에 붙여 넣으세요.</span>';document.querySelector('details.score-edit').open=true;}
  else if(none)h+='<span class="cond">‘/완성’ 결과를 붙여 넣으면 점수가 자동으로 채워집니다.</span>';
  h+='<span class="cond">점수는 서류 완성도이며 합격 가능성이 아닙니다.</span>';
  box.className='score-sum'+(hit?' hit':'');box.innerHTML=h;
}
function renderEval(){
  var body='';
  if(/\|/.test(norm(state.evalOut)))body=norm(state.evalOut);
  else{var m=norm(state.aiOut).match(/===\s*끝\s*===([\s\S]*)$/);if(m)body=m[1].trim();}
  $('evalMd').innerHTML=body?mdRender(body):'';
  $('evalEmpty').hidden=!!body;
  renderScore();
}
$('evalOut').value=state.evalOut||'';
function onEvalOut(){state.evalOut=$('evalOut').value;fillScore(state.evalOut);renderEval();save();markDone();}
$('evalOut').addEventListener('input',onEvalOut);
$('reEval').addEventListener('click',function(){
  var sc=state.score||{};
  var msg='/재평가\n빈칸을 채우고 고친 최종본입니다. 초기 진단과 같은 기준으로 다시 평가해 주세요. 새로 들어간 내용 중 이 대화에서 확인되지 않은 사실이 있으면 어느 문장인지 짚고 물어봐 주세요.'+(sc.init?'\n(초기 '+sc.init+'점'+(sc.target?', 목표 '+sc.target+'점':'')+')':'')+'\n\n===자소서 최종본===\n'+state.items.map(function(it,i){return'[문항 '+(i+1)+']\n'+norm(it.final);}).join('\n')+'\n===끝===';
  copyText(msg,'재평가 요청을 복사했습니다. 같은 대화창에 보내세요.',this);
});

$('nbBtn').addEventListener('click',function(){if(curAct)curAct.f();});
/* ---------- 파일에서 글자 불러오기 ---------- */
var PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadPdfLib(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  return new Promise(function(res,rej){var s=document.createElement('script');s.src=PDFJS+'pdf.min.js';s.onload=function(){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';}catch(e){}res(window.pdfjsLib);};s.onerror=function(){rej(new Error('net'));};document.head.appendChild(s);});
}
function readFileText(file){
  var name=(file.name||'').toLowerCase();
  if(/^image\//.test(file.type))return Promise.reject(new Error('image'));
  if(/\.txt$/.test(name)||file.type==='text/plain')return file.text();
  if(!/\.pdf$/.test(name)&&file.type!=='application/pdf')return Promise.reject(new Error('type'));
  return loadPdfLib().then(function(lib){return file.arrayBuffer().then(function(ab){return lib.getDocument({data:ab,cMapUrl:PDFJS+'cmaps/',cMapPacked:true}).promise;});}).then(function(pdf){
    var n=Math.min(pdf.numPages,10),jobs=[];
    for(var k=1;k<=n;k++)jobs.push(pdf.getPage(k).then(function(pg){return pg.getTextContent();}).then(function(ct){return ct.items.map(function(it){return it.str+(it.hasEOL?'\n':'');}).join('');}));
    return Promise.all(jobs).then(function(pages){return pages.join('\n').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();});
  });
}
function fileMsg(err){
  var m=err&&err.message;
  if(m==='image')return'이미지는 글자를 읽을 수 없습니다. ChatGPT에 지시문을 보낼 때 이 파일을 함께 첨부하세요.';
  if(m==='type')return'PDF나 TXT 파일만 불러올 수 있습니다.';
  if(m==='net')return'PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인하거나 글자를 복사해 붙여 넣으세요.';
  if(m==='empty')return'글자가 없는 PDF(스캔 이미지)입니다. ChatGPT에 파일을 직접 첨부하세요.';
  return'파일을 읽지 못했습니다. 글자를 복사해 붙여 넣으세요.';
}
function handleFile(file,target,stat,onImage){
  stat.className='fstat';stat.textContent='읽는 중…';
  readFileText(file).then(function(txt){
    if(!txt||txt.replace(/\s/g,'').length<10)throw new Error('empty');
    var ta=$(target);
    if(ta.value.trim()&&!ok2('이미 입력한 내용을 파일 내용으로 바꿀까요?')){stat.textContent='';return;}
    ta.value=txt;ta.dispatchEvent(new Event('input'));
    stat.className='fstat ok';stat.textContent='불러왔습니다 ('+txt.replace(/\s/g,'').length+'자). 필요 없는 부분은 지워 주세요.';
    ta.classList.add('flash');
  }).catch(function(e){
    stat.className='fstat err';stat.textContent=fileMsg(e);
    if((e.message==='image'||e.message==='empty')&&onImage)onImage();
  });
}
function jdImage(){var c=$('jdAttach');if(!c.checked){c.checked=true;state.jdAttach=true;save();}}
$('jdFile').addEventListener('change',function(){var f=this.files[0];if(f)handleFile(f,'jd',$('jdStat'),jdImage);this.value='';});
$('qList').addEventListener('change',function(e){var inp=e.target.closest('.dFile');if(!inp)return;var f=inp.files[0],i=inp.dataset.i;if(f)handleFile(f,'d'+i,$('dst'+i));inp.value='';});
function dropTo(id,getStat,onImage){
  var el=$(id)||null;if(!el)return;
  el.addEventListener('dragover',function(e){e.preventDefault();el.classList.add('drop');});
  el.addEventListener('dragleave',function(){el.classList.remove('drop');});
  el.addEventListener('drop',function(e){el.classList.remove('drop');var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;e.preventDefault();handleFile(f,id,getStat(),onImage);});
}
dropTo('jd',function(){return $('jdStat');},jdImage);

/* ---------- 처음 쓰기 워크북 가져오기 ---------- */
function importPackage(txt){
  var t=norm(txt);if(!/===\s*처음 쓰기 워크북 초안\s*===/.test(t))return 0;
  var body=t.split(/===\s*처음 쓰기 워크북 초안\s*===/)[1].split(/===\s*끝\s*===/)[0];
  function field(name){var m=body.match(new RegExp('^'+name+':[ \\t]*(.*)$','m'));return m?m[1].trim():'';}
  var jd=(body.match(/\[공고\]\n?([\s\S]*?)\[\/공고\]/)||[])[1]||'';
  var re=/^\[문항\s*(\d+)\]\s*(.*)$/gm,hits=[],m;
  while((m=re.exec(body)))hits.push({s:m.index,e:m.index+m[0].length,head:m[2]});
  if(!hits.length)return 0;
  var items=hits.map(function(h,i){
    var parts=h.head.split('|').map(function(x){return x.trim();});
    var it=newItem();it.q=parts[0]||'';it.limit=parseInt(parts[1],10)||500;it.mode=/제외/.test(parts[2]||'')?'without':'with';
    it.draft=body.slice(h.e,i+1<hits.length?hits[i+1].s:body.length).replace(/^\n+|\s+$/g,'');return it;});
  var career=(body.match(/\[경력기술\]\n?([\s\S]*?)\[\/경력기술\]/)||[])[1]||'';
  var prep=(body.match(/\[실습준비\]\n?([\s\S]*?)\[\/실습준비\]/)||[])[1]||'';
  var ex=[];if(career.trim())ex.push(career.trim());if(prep.trim())ex.push('현장실습 준비 메모:\n'+prep.trim());
  if(ex.length){state.extra=ex.join('\n\n');$('extra').value=state.extra;}
  state.period=field('실습 기간');var cr=field('학점 연계');state.credit=/없음/.test(cr)?'no':(/인정/.test(cr)?'yes':'');$('period').value=state.period;$('credit').value=state.credit;
  var dir=field('지원 방향');
  state.company=field('기업');state.role=field('직무');state.jd=jd.trim();state.blind=/예/.test(field('블라인드'));state.jdAttach=/예/.test(field('공고 첨부'));
  state.direction=/미정/.test(dir)?'none':(/직무만/.test(dir)?'role':'full');
  state.items=items;state.copied=false;state.aiOut='';state.evalOut='';state.score={};state.self={};
  ['company','role','jd'].forEach(function(id){$(id).value=state[id]||'';});$('blind').checked=state.blind;$('jdAttach').checked=state.jdAttach;
  save();renderQ();markDone();return items.length;
}
function qLimit(q){var m=(q||'').replace(/,/g,'').match(/(\d{2,4})\s*자/);return m?+m[1]:0;}
function qMode(q){return/공백\s*제외/.test(q||'')?'without':(/공백\s*포함/.test(q||'')?'with':'');}
function isQLine(l){
  var s=l.trim();if(s.length<12||/^[\[<【]/.test(s))return false;
  if(/(주십시오|주세요|하시오|바랍니다|보세요|서술|기술|작성)\s*[.?!)\]]*\s*(\([^)]*\))?\s*$/.test(s))return true;
  if(/\?\s*(\([^)]*\))?\s*$/.test(s)&&!/다\.?\s*$/.test(s))return true;
  if(/(\d{2,4}\s*자\s*(이내|이하|내외)|최대\s*[\d,]+\s*자)/.test(s)&&!/다\.\s*$/.test(s))return true;
  return false;
}
function isTitleLine(l){var s=l.trim();return s.length>0&&s.length<=25&&!/[.!?。]$/.test(s)&&!/^[\[<【]/.test(s);}
function splitDrafts(txt){
  var t=norm(txt).replace(/\*\*/g,'');
  if(/===\s*자소서 최종본\s*===/.test(t)||/^[ \t>*#]*\[\s*문항\s*\d+\s*\]/m.test(t)){var o=parseAi(t);var ks=Object.keys(o).map(Number).sort(function(a,b){return a-b;});return ks.length?ks.map(function(k){return{n:k,q:'',txt:o[k]};}):null;}
  var lines=t.split('\n'),qs=[];
  lines.forEach(function(l,i){if(isQLine(l))qs.push(i);});
  function byQ(){
    var out=[];
    qs.forEach(function(qi,k){
      var start=qi,title='';
      var j=qi-1;while(j>=0&&!lines[j].trim())j--;
      if(j>=0&&isTitleLine(lines[j])&&(k===0||j>qs[k-1])){var prevEnd=k?qs[k-1]:-1;if(j>prevEnd+0){title=lines[j].trim();start=j;}}
      out.push({start:start,qi:qi,q:(title?title+' - ':'')+lines[qi].trim()});
    });
    return out.map(function(o,k){var end=k+1<out.length?out[k+1].start:lines.length;return{n:k+1,q:o.q,txt:lines.slice(o.qi+1,end).join('\n').trim()};}).filter(function(o){return o.txt||o.q;});
  }
  if(qs.length>=2)return byQ();
  var re=/^[ \t]*(?:문항\s*(\d+)|Q\s*(\d+)|(\d+)\s*[.)번])[ \t.:)]*(.*)$/gm,hits=[],m;
  while((m=re.exec(t)))hits.push({n:+(m[1]||m[2]||m[3]),s:m.index,e:m.index+m[0].length,rest:m[4]});
  if(hits.length>=2&&hits.every(function(h,i){return h.n===i+1;}))return hits.map(function(h,i){return{n:h.n,q:(h.rest||'').trim(),txt:t.slice(h.e,i+1<hits.length?hits[i+1].s:t.length).trim()};});
  if(qs.length===1)return byQ();
  var hs=[];lines.forEach(function(l,i){if(/^\s*[\[<【][^\]>】]{2,40}[\]>】]\s*$/.test(l))hs.push(i);});
  if(hs.length>=2)return hs.map(function(h,k){var end=k+1<hs.length?hs[k+1]:lines.length;return{n:k+1,q:'',txt:lines.slice(h,end).join('\n').trim()};});
  return null;
}
function putDraft(i,txt){
  while(state.items.length<=i)state.items.push(newItem());
  state.items[i].draft=norm(txt).replace(/\*\*/g,'');
}
function afterImport(msg){var st=$('importStat');st.className='fstat ok';st.textContent=msg;$('importTxt').value='';$('importPick').hidden=true;$('importBox').open=false;save();renderQ();markDone();showImported();toast(msg);}
$('importBtn').addEventListener('click',function(){
  var raw=$('importTxt').value,st=$('importStat');
  if(!raw.trim()){st.className='fstat err';st.textContent='붙여 넣은 내용이 없습니다.';return;}
  if(/처음 쓰기 워크북 초안/.test(raw)){
    var had=state.company||state.items.some(function(i){return i.draft.trim()||i.final.trim();});
    if(had&&!ok2('지금 입력된 내용을 가져온 내용으로 바꿀까요?'))return;
    var n=importPackage(raw);if(n){afterImport('문항 '+n+'개와 초안을 가져왔습니다.');return;}
  }
  var parts=splitDrafts(raw);
  if(parts&&parts.length&&!(parts.length===1&&!parts[0].q)){
    var over=parts.some(function(p){return state.items[p.n-1]&&state.items[p.n-1].draft.trim();});
    if(over&&!ok2('이미 답변이 있는 문항은 새 내용으로 바뀝니다. 계속할까요?'))return;
    parts.forEach(function(p){var i=p.n-1;putDraft(i,p.txt);var it=state.items[i];if(p.q&&!it.q.trim())it.q=p.q;var lm=qLimit(p.q);if(lm)it.limit=lm;var md=qMode(p.q);if(md)it.mode=md;});
    afterImport('문항 '+parts.length+'개로 나눠 넣었습니다. 문항 질문과 글자수를 확인하세요.');return;
  }
  var pick=$('importPick');
  pick.innerHTML='<b>이 글을 어느 문항의 답변으로 넣을까요?</b><div class="chips">'+state.items.map(function(it,i){return'<button type="button" class="chip" data-put="'+i+'">문항 '+(i+1)+(it.q.trim()?': '+esc(it.q.slice(0,18))+(it.q.length>18?'…':''):'')+(it.draft.trim()?' (답변 있음)':'')+'</button>';}).join('')+'<button type="button" class="chip" data-put="new">+ 새 문항으로</button></div>';
  pick.hidden=false;st.className='fstat';st.textContent='';
});
$('importPick').addEventListener('click',function(e){
  var b=e.target.closest('[data-put]');if(!b)return;
  var i=b.dataset.put==='new'?state.items.length:+b.dataset.put;
  if(state.items[i]&&state.items[i].draft.trim()&&!ok2('문항 '+(i+1)+'의 기존 답변을 바꿀까요?'))return;
  putDraft(i,$('importTxt').value);
  afterImport('문항 '+(i+1)+'에 넣었습니다.'+(state.items[i].q.trim()?'':' 문항 질문도 넣어 주세요.'));
});

if(!(state.company||state.role)&&!state.items.some(function(i){return i.q.trim();}))$('importBox').open=true;
function showImported(){
  var s=state,box=$('importedBox');
  var rows=[['실습 기관·분야',(s.company||'미정')+' / '+(s.role||'미정'),'company'],
    ['실습 기간',(s.period||'미입력'),'period'],
    ['모집공고',s.jd.trim()?s.jd.trim().split('\n')[0].slice(0,40)+'…':(s.jdAttach?'파일로 첨부 예정':'없음'),'jd'],
    ['경력 기술 5줄',s.extra.trim()?s.extra.trim().split('\n').length+'줄 (참고 자료 칸)':'없음','extra']];
  s.items.forEach(function(it,i){rows.push(['문항 '+(i+1),(it.q||'').slice(0,34)+(it.q.length>34?'…':'')+' · 초안 '+cnt(it,it.draft)+'자','d'+i]);});
  box.innerHTML='<h2>✓ 가져온 내용</h2><p class="hint" style="margin:4px 0 0">아래 칸들에 채워졌습니다. ‘보기’를 누르면 해당 칸으로 이동합니다. 확인했으면 AI 코치로 가세요.</p><ul class="imp-list">'+
    rows.map(function(r){return'<li><span class="k">'+esc(r[0])+'</span><span>'+esc(r[1])+'</span><a data-see="'+r[2]+'">보기</a></li>';}).join('')+'</ul><div class="btns"><button class="btn" type="button" data-go="2">AI 코치로 가기</button></div>';
  box.hidden=false;box.scrollIntoView({behavior:'smooth',block:'start'});
}
$('importedBox').addEventListener('click',function(e){var a=e.target.closest('[data-see]');if(a)focusEl(a.dataset.see);});
$('importTxt').addEventListener('paste',function(){setTimeout(function(){$('importBtn').click();},30);});

renderQ();
if(window.__handover){var ho=window.__handover;window.__handover=null;state.step=1;var hn=importPackage(ho);if(hn){afterImport('처음 쓰기에서 문항 '+hn+'개와 초안을 가져왔습니다. 확인 후 AI 코치로 가세요.');}}
go(state.step>=1&&state.step<=3?state.step:1);

}
var start='first';try{start=localStorage.getItem('intern-app')==='revise'?'revise':'first';}catch(e){}
window.switchApp(start);
})();
